<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Contact · Hello, World!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme:dark; --ink:#f4f3ff; --muted:#a5a5bd; --mint:#72f2c5 }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:100px 24px 32px; color:var(--ink); font-family:Manrope,system-ui,sans-serif; background:radial-gradient(ellipse at 50% 42%,#282344 0%,#171827 46%,#10131f 78%) }
    nav { position:fixed; z-index:2; top:24px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:7px; border:1px solid #ffffff1c; border-radius:999px; background:#10131fbb; backdrop-filter:blur(14px) }
    nav a { padding:9px 15px; border-radius:999px; color:var(--muted); text-decoration:none; font-size:13px; font-weight:700; transition:background .2s,color .2s }
    nav a:hover, nav a[aria-current="page"] { color:var(--ink); background:#ffffff14 }
    main { width:min(100%,680px); padding:clamp(32px,7vw,64px); border:1px solid #ffffff1c; border-radius:28px; background:linear-gradient(145deg,#ffffff0d,#ffffff04); box-shadow:0 32px 100px #0006,inset 0 1px #ffffff14; backdrop-filter:blur(18px); animation:arrive .7s ease both }
    .eyebrow { margin:0 0 14px; color:var(--mint); font:500 11px 'DM Mono',monospace; letter-spacing:.22em; text-transform:uppercase }
    h1 { margin:0; font-size:clamp(46px,9vw,76px); line-height:1.03; letter-spacing:-.075em; font-weight:800 }
    h1 span { color:transparent; background:linear-gradient(100deg,#c4b5fd,#f0abfc 55%,#72f2c5); -webkit-background-clip:text; background-clip:text }
    .intro { margin:22px 0 32px; color:var(--muted); font-size:16px; line-height:1.85 }
    .contact { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; padding:20px 22px; border:1px solid #ffffff16; border-radius:16px; background:#0b0d1766 }
    .contact span { color:var(--muted); font-size:13px }
    .contact a { color:var(--mint); font-weight:700; text-decoration:none; overflow-wrap:anywhere }
    .contact a:hover { text-decoration:underline }
    .next { margin:28px 0 0; color:var(--muted); font-size:14px } .next a { color:#c4b5fd; font-weight:700; text-decoration:none } .next a:hover { text-decoration:underline }
    @keyframes arrive { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <p class="eyebrow">Let’s talk</p>
    <h1>Say <span>hello.</span></h1>
    <p class="intro">Have a question, an idea, or just want to say hi? We’d love to hear from you. Send a note and we’ll take it from there.</p>
    <div class="contact"><span>Email us</span><a href="mailto:hello@example.com">hello@example.com ↗</a></div>
    <p class="next">Want to know what we’re about? <a href="about.html">Meet us →</a></p>
  </main>
</body>
</html>
