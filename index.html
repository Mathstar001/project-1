<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Hello, World!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme: dark; --ink:#f4f3ff; --muted:#a5a5bd; --violet:#a78bfa; --mint:#72f2c5; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; padding:24px; color:var(--ink); font-family:Manrope,system-ui,sans-serif; background:radial-gradient(ellipse at 50% 42%,#282344 0%,#171827 46%,#10131f 78%); }
    .glow { position:fixed; width:420px; height:420px; border-radius:50%; filter:blur(100px); opacity:.16; pointer-events:none; animation:drift 9s ease-in-out infinite alternate; }
    .glow.one { background:#8b5cf6; top:-190px; left:-120px } .glow.two { background:#34d399; right:-180px; bottom:-230px; animation-delay:-4s }
    main { position:relative; width:min(100%,680px); text-align:center; padding:clamp(36px,8vw,72px) clamp(24px,7vw,64px); border:1px solid #ffffff1c; border-radius:28px; background:linear-gradient(145deg,#ffffff0d,#ffffff04); box-shadow:0 32px 100px #0006,inset 0 1px #ffffff14; backdrop-filter:blur(18px); animation:arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .orb { display:grid; place-items:center; width:74px; height:74px; margin:0 auto 28px; border:1px solid #c4b5fd55; border-radius:24px; color:#e9ddff; font-size:32px; background:linear-gradient(145deg,#a78bfa44,#72f2c522); box-shadow:0 0 42px #a78bfa2b,inset 0 1px #fff3; transform:rotate(-6deg); }
    .eyebrow { margin:0 0 14px; color:var(--mint); font:500 11px 'DM Mono',monospace; letter-spacing:.22em; text-transform:uppercase }
    h1 { margin:0; font-size:clamp(48px,10vw,82px); line-height:1.02; letter-spacing:-.075em; font-weight:800; }
    h1 span { display:block; color:transparent; background:linear-gradient(100deg,#c4b5fd 10%,#f0abfc 52%,#72f2c5 100%); -webkit-background-clip:text; background-clip:text; }
    .intro { max-width:420px; margin:22px auto 30px; color:var(--muted); font-size:15px; line-height:1.8 }
    .code { display:inline-flex; align-items:center; gap:12px; max-width:100%; padding:13px 17px; border:1px solid #ffffff16; border-radius:12px; background:#0b0d17aa; color:#e4e0f7; font:13px 'DM Mono',monospace; }
    .prompt { color:var(--mint) } .cursor { width:7px; height:16px; background:var(--violet); border-radius:2px; animation:blink 1.1s steps(2,start) infinite }
    footer { margin-top:34px; color:#77778f; font:10px 'DM Mono',monospace; letter-spacing:.14em; text-transform:uppercase }
    @keyframes blink { to { visibility:hidden } } @keyframes arrive { from { opacity:0; transform:translateY(18px) scale(.98) } to { opacity:1; transform:none } } @keyframes drift { to { transform:translate(35px,45px) scale(1.1) } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="orb" aria-hidden="true">✦</div>
    <p class="eyebrow">A little beginning</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="intro">Every great idea starts somewhere. Here’s to the first line, the next big thing, and everything in between.</p>
    <div class="code" aria-label="Code sample"><span class="prompt">&gt;</span><span>printf("hello, world");</span><i class="cursor" aria-hidden="true"></i></div>
    <footer>Made with curiosity · 001</footer>
  </main>
</body>
</html>
